<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Deck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tiles.css">
<link rel="stylesheet" href="css/background.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/fades.css">
<!-- One file per theme. To add a theme: new file here + an entry in js/themes.js -->
<link rel="stylesheet" href="css/themes/ps.css">
<link rel="stylesheet" href="css/themes/switch.css">
<link rel="stylesheet" href="css/themes/xbox.css">
<link rel="stylesheet" href="css/themes/gta6-retro.css">
<link rel="stylesheet" href="css/themes/gta6.css">
<link rel="stylesheet" href="css/themes/youtube.css">
<link rel="stylesheet" href="css/themes/netflix.css">
<link rel="stylesheet" href="css/themes/hbomax.css">
<link rel="stylesheet" href="css/themes/primevideo.css">
<link rel="stylesheet" href="css/themes/appletv.css">
<link rel="stylesheet" href="css/themes/applemusic.css">
<link rel="stylesheet" href="css/themes/applemusicglass.css">
<link rel="stylesheet" href="css/themes/stream.css">
<link rel="stylesheet" href="css/themes/tv.css">
<link rel="stylesheet" href="css/themes/home.css">
</head>
<body>
<main id="deck">
<div id="bgImage" hidden><div id="bgScrim"></div></div>
<div id="widgets" hidden></div>
<header><strong>Source Deck</strong><div id="headRight"><span id="count"></span><p id="scan" role="status"></p></div></header>
<section aria-live="polite"><div id="meta"></div><h1 id="title"></h1><small id="detail"></small><p id="status" role="status"></p></section>
<div id="browser" hidden><h2 id="bpath"></h2><div id="blist" role="list"></div><p id="bhint" data-i18n="↑↓ choose · OK open/play · Back up">↑↓ choose · OK open/play · Back up</p></div>
<div id="arrangeView" hidden><h2 data-i18n="Arrange sources">Arrange sources</h2><div id="arrCols"><div id="colA" class="col"><h3 id="hA"></h3><div id="alist" role="list"></div></div><div id="colS" class="col"><h3 id="hS"></h3><div id="slist" role="list"></div></div></div><p id="ahint"></p></div>
<div id="bgView" hidden><div id="bgPanel"><h2 id="bgTitle">Change background</h2><div id="bgList" role="list"></div><div id="bgGrid" hidden></div><p id="bgStatus"></p><p id="bgHint"></p></div><div id="bgSheet" hidden><h3 id="bgSheetTitle"></h3><div id="bgSheetList" role="list"></div></div></div>
<div id="settingsView" hidden><div id="setPanel"><h2 id="setTitle"></h2><div id="setAbout" hidden><h3 id="setName"></h3><div id="setBio"></div></div><div id="setList" role="list"></div><div id="setLink" hidden><p id="setUrl"></p><div id="setQr"></div></div><p id="setStatus"></p><p id="setHint"></p></div></div>
<div id="widgetsView" hidden data-view="menu"><div id="wPanel"><h2 id="wTitle"></h2><div id="wList" role="list"></div><p id="wStatus"></p><p id="wHint"></p></div><div id="wMoveHint" hidden></div></div>
<div id="themeView" hidden><h2 id="themeFor">Theme</h2><div id="tcols"><div id="tcolT" class="col active"><h3 data-i18n="Themes">Themes</h3><div id="tlist" role="list"></div></div><div id="tcolA" class="col"><h3 data-i18n="Accent color">Accent color</h3><div id="taccents" role="list"></div></div></div><p id="thint"></p></div>
<div id="loginView" hidden><h2 id="loginTitle"></h2><p id="loginText"></p><p id="loginCode"></p><div id="loginQr" hidden></div></div>
<div id="searchView" hidden><h2 id="searchTitle">Search</h2><input id="searchInput" type="text" placeholder="Artist, song or album" data-i18n-placeholder="Artist, song or album" autocomplete="off"><div id="searchBtns"><button id="searchGo">Search</button><button id="searchCancel" data-i18n="Cancel">Cancel</button></div><p id="shint" data-i18n="OK on the box opens the keyboard · when you are done, press OK on Search · Back cancels">OK on the box opens the keyboard · when you are done, press OK on Search · Back cancels</p></div>
<div id="feed" hidden><div id="subs"></div><div id="feedStatus"></div><div id="vids"></div><div id="feedActions"><button id="musicOpen" class="chan all">Open in Apple Music</button></div></div>
<div id="focusRing" aria-hidden="true"></div>
<div id="glassLens" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#0a0a0f"><rect x="39" y="35" width="6.4" height="34"/><rect x="66" y="28" width="6.4" height="34"/><path d="M39 35L72.4 26.5V38L39 46.5Z"/><ellipse cx="34.5" cy="72" rx="11.5" ry="8.5" transform="rotate(-18 34.5 72)"/><ellipse cx="61.5" cy="65" rx="11.5" ry="8.5" transform="rotate(-18 61.5 65)"/></g></svg></div>
<div id="bgCredit" hidden></div>
<div id="strip" role="listbox" aria-label="Sources"></div>
<footer class="nav"><button id="ytlogin" hidden data-i18n="Log in">Log in</button><button id="theme" data-i18n="Change theme">Change theme</button><button id="bgbtn" data-i18n="Change background">Change background</button><button id="widgetsbtn" data-i18n="Widgets">Widgets</button><button id="arrange" data-i18n="Arrange">Arrange</button><button id="refresh" data-i18n="Rescan sources">Rescan sources</button><button id="settings" class="gear" aria-label="Settings" data-i18n-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button></footer>
</main>
<svg id="glassDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<object id="surface" type="application/avplayer" hidden></object>
<button id="back" hidden data-i18n="Back to sources">Back to sources</button>

<!-- Templates cloned by js/templates.js -->
<template id="tpl-tile"><button class="tile" role="option"><b></b><span><span data-name></span><small></small></span></button></template>
<template id="tpl-video"><button class="vid"><img alt=""><span></span><small></small></button></template>
<template id="tpl-channel"><button class="chan"><img alt=""></button></template>
<template id="tpl-channel-all"><button class="chan all">All</button></template>
<template id="tpl-track"><button class="vid sq"><img alt=""><span></span><small></small></button></template>
<template id="tpl-skeleton"><div class="vid sq skel"><i></i><b></b><b></b></div></template>
<template id="tpl-bgtile"><button class="bgtile"><img alt=""><span></span></button></template>
<template id="tpl-row"><button></button></template>

<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="sources.js"></script>
<script src="youtube-config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="backgrounds-config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
