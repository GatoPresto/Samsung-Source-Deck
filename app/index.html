<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Deck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tiles.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/fades.css">
<!-- One file per theme. To add a theme: new file here + an entry in js/themes.js -->
<link rel="stylesheet" href="css/themes/ps.css">
<link rel="stylesheet" href="css/themes/switch.css">
<link rel="stylesheet" href="css/themes/xbox.css">
<link rel="stylesheet" href="css/themes/gta6-retro.css">
<link rel="stylesheet" href="css/themes/gta6.css">
<link rel="stylesheet" href="css/themes/youtube.css">
<link rel="stylesheet" href="css/themes/netflix.css">
<link rel="stylesheet" href="css/themes/hbomax.css">
<link rel="stylesheet" href="css/themes/primevideo.css">
<link rel="stylesheet" href="css/themes/appletv.css">
<link rel="stylesheet" href="css/themes/applemusic.css">
<link rel="stylesheet" href="css/themes/applemusicglass.css">
<link rel="stylesheet" href="css/themes/stream.css">
<link rel="stylesheet" href="css/themes/tv.css">
</head>
<body>
<main id="deck">
<header><strong>Source Deck</strong><div id="headRight"><span id="count"></span><p id="scan" role="status"></p></div></header>
<section aria-live="polite"><div id="meta"></div><h1 id="title"></h1><small id="detail"></small><p id="status" role="status"></p></section>
<div id="browser" hidden><h2 id="bpath"></h2><div id="blist" role="list"></div><p id="bhint">↑↓ choose · OK open/play · Back up</p></div>
<div id="arrangeView" hidden><h2>Arrange sources</h2><div id="arrCols"><div id="colA" class="col"><h3 id="hA"></h3><div id="alist" role="list"></div></div><div id="colS" class="col"><h3 id="hS"></h3><div id="slist" role="list"></div></div></div><p id="ahint"></p></div>
<div id="themeView" hidden><h2 id="themeFor">Theme</h2><div id="tlist" role="list"></div><p id="thint">↑↓ choose · OK select · Back cancel</p></div>
<div id="loginView" hidden><h2 id="loginTitle"></h2><p id="loginText"></p><p id="loginCode"></p><div id="loginQr" hidden></div></div>
<div id="searchView" hidden><h2>Search Apple Music</h2><input id="searchInput" type="text" placeholder="Artist, song or album" autocomplete="off"><div id="searchBtns"><button id="searchGo">Search</button><button id="searchCancel">Cancel</button></div><p id="shint">OK on the box opens the keyboard · when you are done, press OK on Search · Back cancels</p></div>
<div id="feed" hidden><div id="subs"></div><div id="feedStatus"></div><div id="vids"></div><div id="feedActions"><button id="musicOpen" class="chan all">Open in Apple Music</button></div></div>
<div id="focusRing" aria-hidden="true"></div>
<div id="glassLens" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#0a0a0f"><rect x="39" y="35" width="6.4" height="34"/><rect x="66" y="28" width="6.4" height="34"/><path d="M39 35L72.4 26.5V38L39 46.5Z"/><ellipse cx="34.5" cy="72" rx="11.5" ry="8.5" transform="rotate(-18 34.5 72)"/><ellipse cx="61.5" cy="65" rx="11.5" ry="8.5" transform="rotate(-18 61.5 65)"/></g></svg></div>
<div id="strip" role="listbox" aria-label="Sources"></div>
<footer class="nav"><button id="ytlogin" hidden>Log in</button><button id="theme">Change theme</button><button id="arrange">Arrange</button><button id="refresh">Refresh</button></footer>
</main>
<svg id="glassDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<object id="surface" type="application/avplayer" hidden></object>
<button id="back" hidden>Back to sources</button>

<!-- Templates cloned by js/templates.js -->
<template id="tpl-tile"><button class="tile" role="option"><b></b><span><span data-name></span><small></small></span></button></template>
<template id="tpl-video"><button class="vid"><img alt=""><span></span><small></small></button></template>
<template id="tpl-channel"><button class="chan"><img alt=""></button></template>
<template id="tpl-channel-all"><button class="chan all">All</button></template>
<template id="tpl-track"><button class="vid sq"><img alt=""><span></span><small></small></button></template>
<template id="tpl-skeleton"><div class="vid sq skel"><i></i><b></b><b></b></div></template>
<template id="tpl-row"><button></button></template>

<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="sources.js"></script>
<script src="youtube-config.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
